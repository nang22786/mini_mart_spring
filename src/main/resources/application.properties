# Server Configuration
server.port=8080
server.address=0.0.0.0
spring.application.name=minimart-api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Final
#spring.datasource.username=postgres
#spring.datasource.password=123
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=final

# Logging
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.com.minimart.api=DEBUG
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.com.minimart.api=INFO

# JPA Entity Scan (only User for now)
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=2KB

# File Storage Configuration
#file.upload-dir=upload
file.upload-dir=${UPLOAD_DIR:uploads}
file.upload.profile=uploads/profiles
file.upload.category=uploads/category
file.upload.product=uploads/products
file.upload.payment=uploads/payments
file.upload.advertising=uploads/advertising

